# Personal Ghostty overrides, layered on top of Omarchy's ~/.config/ghostty/config.
#
# Omarchy's config pulls this file in with:
#
#   config-file = ?"~/.config/ghostty/overrides.conf"
#

# Font
font-size = 12

# Undo Omarchy's `async-backend = epoll` (shipped config line 41).
# That backend segfaults Ghostty's io thread on a null WriteRequest queue:
# basecamp/omarchy#6868 / mitchellh/libxev#234. `auto` is Ghostty's default.
async-backend = auto
