# Personal Ghostty overrides, layered on top of Omarchy's ~/.config/ghostty/config.
#
# Omarchy owns ~/.config/ghostty/config and mutates it during `omarchy update`
# (migrations append to it and sed into it), so that file is deliberately NOT
# stowed -- stowing would replace it with a symlink that sed -i would destroy.
# Instead, Omarchy's config pulls this file in with:
#
#   config-file = ?"~/.config/ghostty/overrides.conf"
#
# Ghostty parses included files after the parent finishes, so anything set here
# wins over Omarchy's values regardless of where the include line sits.
#
# Notes:
#   - Most settings: last value wins, so just assign it here.
#   - font-family is a list (fallback fonts), not a scalar. Setting it here only
#     appends. Reset with `font-family = ""` first if you ever want to pin it.
#     Left alone on purpose -- `omarchy font set` manages the family.
#   - keybind entries accumulate. Drop an inherited one with
#     `keybind = <trigger>=unbind`.
#
# Apply changes without restarting the terminal: omarchy restart terminal

# Font
# Size only. `omarchy font set` rewrites font-family and leaves size alone,
# so pinning this here doesn't fight it.
font-size = 12
